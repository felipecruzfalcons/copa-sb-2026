<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa SB 2026 · Classificação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:      #E8A000;
    --gold-bg:   #E8A000;
    --border:    #e0e0e0;
    --text:      #1a1a1a;
    --gray:      #777777;
    --green:     #16a34a;
    --red:       #dc2626;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: #d4d4d4;
    color: var(--text);
    font-family: 'Saira Condensed', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─── */
  .page-header {
    background: #ffffff;
    border-bottom: 3px solid var(--gold);
    padding: 16px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 2vw;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: #111;
    text-transform: uppercase;
  }
  .brand span { color: var(--gold); }
  .update-badge {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1.4vw;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #888;
    text-transform: uppercase;
  }
  .update-badge b { color: var(--gold); }

  /* ─── MAIN ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 2vh 2vw;
  }

  /* ─── CARD ─── */
  .card {
    width: 100%;
    max-width: 96vw;
    background: #ffffff;
    border: 2px solid var(--gold);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  /* ─── TABELA ─── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Saira Condensed', sans-serif;
  }

  thead tr { background: #f5f5f5; border-bottom: 2px solid var(--border); }

  thead th {
    font-weight: 800;
    font-size: 1.4vw;
    letter-spacing: 0.18em;
    color: #888;
    padding: 1.4vh 1vw;
    text-align: center;
    white-space: nowrap;
    text-transform: uppercase;
  }
  thead th.team-h { text-align: left; padding-left: 2vw; }
  thead th.pos { width: 4vw; }
  thead th.pts { color: var(--gold); }

  thead tr th { border-bottom: 2px solid var(--border); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    background: #ffffff;
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fff8e8; }
  tbody tr.leader { background: #fffbee; border-left: 3px solid var(--gold); }

  td {
    padding: 1.4vh 1vw;
    text-align: center;
    font-weight: 600;
    font-size: 1.8vw;
    color: #333;
  }
  td.pos {
    font-size: 1.3vw;
    color: #aaa;
    font-weight: 800;
    letter-spacing: 0.1em;
  }
  td.team-cell {
    text-align: left;
    padding-left: 1.5vw;
    font-weight: 800;
    font-size: 2vw;
    white-space: nowrap;
    color: #111;
  }

  td.pos-sg { color: var(--green); font-weight: 800; }
  td.neg-sg { color: var(--red);   font-weight: 800; }
  td.neu-sg  { color: #aaa; }

  td.pts-ext { color: var(--gold); font-weight: 800; }
  td.pts-col { color: var(--gold); font-weight: 800; }
  td.total-col {
    color: #111;
    font-weight: 900;
    font-size: 2.2vw;
    background: rgba(232,160,0,0.08);
  }

  tr.group-hdr:first-child td { padding-top: 1.2vh; }

  tr.group-hdr td {
    background: #f5f5f5;
    font-size: 1.1vw;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-align: left;
    padding: 0.5vh 1.5vw;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .squad-img {
    display: inline-block;
    width: 4.5vw;
    height: 4.5vw;
    border-radius: 8px;
    object-fit: cover;
    object-position: center center;
    margin-right: 1vw;
    vertical-align: middle;
    border: 2px solid rgba(232,160,0,0.4);
    background: #eee;
    flex-shrink: 0;
  }

  /* ─── LEGENDA ─── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1.2vw;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #888;
    padding: 1.2vh 2vw;
    background: #f5f5f5;
    border-top: 1px solid var(--border);
    text-transform: uppercase;
  }
  .legend strong { color: #333; }
  .legend .upd { color: var(--gold); margin-left: auto; }

  /* ─── FOOTER ─── */
  .page-footer {
    text-align: center;
    padding: 14px;
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1vw;
    letter-spacing: 0.2em;
    color: #aaa;
    border-top: 1px solid var(--border);
    background: #ffffff;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<script>
const CONFIG = {
  atualizadoEm: "19 AGO · SEMANA 5",
  grupos: [
    {
      nome: "GRUPO CLOSER",
      times: [
        { pos:1, cod:"CA", nome:"FALCONS", part:1, vit:1, der:0, gp:19, gc:16, saldo:"+3",  ptsExt:"+5",   pts:3,  total:8,    lider:true  },
        { pos:2, cod:"CB", nome:"STARK",   part:1, vit:0, der:1, gp:16, gc:19, saldo:"-3",  ptsExt:"+3,2", pts:1,  total:4.2,  lider:false },
      ]
    },
    {
      nome: "GRUPO GERENTES DE CONTAS",
      times: [
        { pos:1, cod:"GB", nome:"NEXUS",    part:1, vit:1, der:0, gp:15, gc:10, saldo:"+5",  ptsExt:"+2,7", pts:3,  total:5.7,  lider:true  },
        { pos:2, cod:"GA", nome:"MAVERICK", part:1, vit:0, der:1, gp:10, gc:15, saldo:"-5",  ptsExt:"+1",   pts:1,  total:2,    lider:false },
      ]
    }
  ]
};
const IMG = {
  CA: "https://felipecruzfalcons.github.io/copa-sb-2026/falcons.jpg",
  CB: "https://felipecruzfalcons.github.io/copa-sb-2026/stark.jpg",
  GB: "https://felipecruzfalcons.github.io/copa-sb-2026/nexus.jpg",
  GA: "https://felipecruzfalcons.github.io/copa-sb-2026/maverick.jpg"
};
function sgClass(s){ return s.startsWith("+") ? "pos-sg" : (s.startsWith("−")||s.startsWith("-")) ? "neg-sg" : "neu-sg"; }
</script>

<header class="page-header">
  <div class="brand"><span>COPA SB</span> · 2026</div>
  <div class="update-badge">Atualizado: <b id="upd"></b></div>
</header>

<main class="main">
  <div class="card">
    <table>
      <thead>
        <tr>
          <th class="pos">#</th>
          <th class="team-h">Squad</th>
          <th>Part.</th>
          <th>Vit.</th>
          <th>Der.</th>
          <th>GP</th>
          <th>GC</th>
          <th>Saldo</th>
          <th class="pts">Pts Ext.</th>
          <th class="pts">Pts</th>
          <th class="pts">Total</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="legend">
      <span><strong>Saldo</strong> = gols pró − gols contra</span>
      <span><strong>Pts</strong> = vitória 3 · derrota 1</span>
      <span><strong>Total</strong> = Pts + Pts Ext.</span>
      <span class="upd">Atualiza toda quinta</span>
    </div>
  </div>

</main>

<footer class="page-footer">Copa SB 2026 · SeuBoné</footer>

<script>
document.getElementById("upd").textContent = CONFIG.atualizadoEm;
const tbody = document.getElementById("tbody");
const COLS = 11;
CONFIG.grupos.forEach(grupo => {
  const hdr = document.createElement("tr");
  hdr.className = "group-hdr";
  hdr.innerHTML = `<td colspan="${COLS}">${grupo.nome}</td>`;
  tbody.appendChild(hdr);
  grupo.times.forEach(t => {
    const tr = document.createElement("tr");
    if (t.lider) tr.classList.add("leader");
    const sgC = sgClass(t.saldo);
    tr.innerHTML = `
      <td class="pos">${t.pos}</td>
      <td class="team-cell"><img class="squad-img" src="${IMG[t.cod]}" alt="${t.nome}">${t.nome}</td>
      <td>${t.part}</td>
      <td>${t.vit}</td>
      <td>${t.der}</td>
      <td>${t.gp}</td>
      <td>${t.gc}</td>
      <td class="${sgC}">${t.saldo}</td>
      <td class="pts-ext">${t.ptsExt}</td>
      <td class="pts-col">${t.pts}</td>
      <td class="total-col">${t.total}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>

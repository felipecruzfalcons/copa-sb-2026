<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa SB 2026 · Classificação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:      #FCC100;
    --gold-bg:   #FCC100;
    --gold-dim:  #C99000;
    --row-bg:    #1a1600;
    --row-alt:   #221c00;
    --row-leader:#2a2200;
    --border:    rgba(252,193,0,0.15);
    --text:      #e8e8e8;
    --gray:      rgba(255,255,255,0.45);
    --green:     #4ade80;
    --red:       #f87171;
    --white:     #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: #f0f0f0;
    color: var(--text);
    font-family: 'Saira Condensed', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─── */
  .page-header {
    background: #111;
    padding: 16px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 2vw;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: #fff;
    text-transform: uppercase;
  }
  .brand span { color: var(--gold-bg); }
  .update-badge {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1.4vw;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #aaa;
    text-transform: uppercase;
  }
  .update-badge b { color: var(--gold-bg); }

  /* ─── MAIN ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 2vh 2vw;
  }

  /* ─── CARD WRAPPER ─── */
  .card {
    width: 100%;
    max-width: 96vw;
    border: 1px solid rgba(252,193,0,0.2);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 32px rgba(0,0,0,0.10);
  }

  /* ─── TABELA ─── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Saira Condensed', sans-serif;
  }

  thead tr { background: #111; }

  thead th {
    font-weight: 800;
    font-size: 1.4vw;
    letter-spacing: 0.18em;
    color: #aaa;
    padding: 1.4vh 1vw;
    text-align: center;
    white-space: nowrap;
    text-transform: uppercase;
  }
  thead th.team-h { text-align: left; padding-left: 2vw; }
  thead th.pos { width: 4vw; }
  thead th.pts { color: var(--gold-bg); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    background: var(--row-bg);
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(252,193,0,0.08); }
  tbody tr.leader { background: var(--row-leader); border-left: 3px solid var(--gold); }

  td {
    padding: 1.4vh 1vw;
    text-align: center;
    font-weight: 600;
    font-size: 1.8vw;
    color: #e8e8e8;
  }
  td.pos {
    font-size: 1.3vw;
    color: var(--gray);
    font-weight: 800;
    letter-spacing: 0.1em;
  }
  td.team-cell {
    text-align: left;
    padding-left: 1.5vw;
    font-weight: 800;
    font-size: 2vw;
    white-space: nowrap;
    color: #fff;
  }

  td.pos-sg { color: var(--green); font-weight: 800; }
  td.neg-sg { color: var(--red);   font-weight: 800; }
  td.neu-sg  { color: var(--gray); }

  td.pts-ext { color: var(--gold); font-weight: 800; }
  td.pts-col { color: var(--gold); font-weight: 800; }
  td.total-col {
    color: #fff;
    font-weight: 900;
    font-size: 2.2vw;
    background: rgba(252,193,0,0.10);
  }

  thead tr th {
    border-bottom: 4px solid transparent;
  }

  tr.group-hdr:first-child td {
    padding-top: 1.2vh;
  }

  tr.group-hdr td {
    background: #111;
    font-size: 1.1vw;
    font-weight: 800;
    letter-spacing: 0.3em;
    color: var(--gold-bg);
    text-align: left;
    padding: 0.5vh 1.5vw;
    text-transform: uppercase;
  }

  .squad-img {
    display: inline-block;
    width: 4.5vw;
    height: 4.5vw;
    border-radius: 8px;
    object-fit: cover;
    object-position: center center;
    margin-right: 1vw;
    vertical-align: middle;
    border: 2px solid rgba(252,193,0,0.4);
    background: #111;
    flex-shrink: 0;
  }

  /* ─── LEGENDA ─── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1.2vw;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--gray);
    padding: 1.2vh 2vw;
    background: #111;
    border-top: 1px solid rgba(252,193,0,0.15);
    text-transform: uppercase;
  }
  .legend strong { color: #fff; }
  .legend .upd { color: var(--gold); margin-left: auto; }

  /* ─── FOOTER ─── */
  .page-footer {
    text-align: center;
    padding: 14px;
    font-family: 'Saira Condensed', sans-serif;
    font-size: 1vw;
    letter-spacing: 0.2em;
    color: #bbb;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: #0d0d0d;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<script>
const CONFIG = {
  atualizadoEm: "18 AGO · SEMANA 7",
  grupos: [
    {
      nome: "GRUPO CLOSER",
      times: [
        { pos:1, cod:"CB", nome:"STARK", part:4, vit:3, der:1, gp:21, gc:14, saldo:"+7",  ptsExt:"+3", pts:10, total:13, lider:true  },
        { pos:2, cod:"CA", nome:"FALCONS", part:4, vit:1, der:3, gp:14, gc:21, saldo:"−7",  ptsExt:"+1", pts:6,  total:7,  lider:false },
      ]
    },
    {
      nome: "GRUPO GERENTES DE CONTAS",
      times: [
        { pos:1, cod:"GB", nome:"NEXUS", part:4, vit:4, der:0, gp:23, gc:12, saldo:"+11", ptsExt:"+4", pts:12, total:16, lider:true  },
        { pos:2, cod:"GA", nome:"MAVERICK", part:4, vit:0, der:4, gp:12, gc:23, saldo:"−11", ptsExt:"+2", pts:4,  total:6,  lider:false },
      ]
    }
  ]
};
const IMG = {
  CA: "https://felipecruzfalcons.github.io/copa-sb-2026/falcons.jpg",
  CB: "https://felipecruzfalcons.github.io/copa-sb-2026/stark.jpg",
  GB: "https://felipecruzfalcons.github.io/copa-sb-2026/nexus.jpg",
  GA: "https://felipecruzfalcons.github.io/copa-sb-2026/maverick.jpg"
};
function sgClass(s){ return s.startsWith("+") ? "pos-sg" : (s.startsWith("−")||s.startsWith("-")) ? "neg-sg" : "neu-sg"; }
</script>

<header class="page-header">
  <div class="brand"><span>COPA SB</span> · 2026</div>
  <div class="update-badge">Atualizado: <b id="upd"></b></div>
</header>

<main class="main">
  <div class="card">
    <table>
      <thead>
        <tr>
          <th class="pos">#</th>
          <th class="team-h">Squad</th>
          <th>Part.</th>
          <th>Vit.</th>
          <th>Der.</th>
          <th>GP</th>
          <th>GC</th>
          <th>Saldo</th>
          <th class="pts">Pts Ext.</th>
          <th class="pts">Pts</th>
          <th class="pts">Total</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="legend">
      <span><strong>Saldo</strong> = gols pró − gols contra</span>
      <span><strong>Pts</strong> = vitória 3 · derrota 1</span>
      <span><strong>Total</strong> = Pts + Pts Ext.</span>
      <span class="upd">Atualiza toda quinta</span>
    </div>
  </div>

</main>

<footer class="page-footer">Copa SB 2026 · SeuBoné</footer>

<script>
document.getElementById("upd").textContent = CONFIG.atualizadoEm;
const tbody = document.getElementById("tbody");
const COLS = 11;
CONFIG.grupos.forEach(grupo => {
  const hdr = document.createElement("tr");
  hdr.className = "group-hdr";
  hdr.innerHTML = `<td colspan="${COLS}">${grupo.nome}</td>`;
  tbody.appendChild(hdr);
  grupo.times.forEach(t => {
    const tr = document.createElement("tr");
    if (t.lider) tr.classList.add("leader");
    const sgC = sgClass(t.saldo);
    tr.innerHTML = `
      <td class="pos">${t.pos}</td>
      <td class="team-cell"><img class="squad-img" src="${IMG[t.cod]}" alt="${t.nome}">${t.nome}</td>
      <td>${t.part}</td>
      <td>${t.vit}</td>
      <td>${t.der}</td>
      <td>${t.gp}</td>
      <td>${t.gc}</td>
      <td class="${sgC}">${t.saldo}</td>
      <td class="pts-ext">${t.ptsExt}</td>
      <td class="pts-col">${t.pts}</td>
      <td class="total-col">${t.total}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
